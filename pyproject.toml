[project]
name = "likesurgeon"
version = "0.11.1"
description = "Back up your YouTube Music liked songs, find relinked, duplicate and dead likes, and fix the ones it can prove."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "zeikar" }]
keywords = [
  "youtube-music",
  "ytmusic",
  "youtube",
  "liked-songs",
  "likes",
  "backup",
  "ytmusicapi",
  "music-library",
  "cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Utilities",
]
dependencies = [
  "ytmusicapi>=1.7",
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "rapidfuzz>=3.6",
  "sqlalchemy>=2.0",
  "google-auth-oauthlib>=1.2",
  "google-api-python-client>=2.120",
  "browser-cookie3>=0.20.1",
]

[project.urls]
Homepage = "https://zeikar.dev/projects/like-surgeon/"
Source = "https://github.com/zeikar/like-surgeon"
Issues = "https://github.com/zeikar/like-surgeon/issues"
Changelog = "https://github.com/zeikar/like-surgeon/releases"

[project.scripts]
likesurgeon = "likesurgeon.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/likesurgeon"]

# Keep README images and maintainer docs out of the sdist.
[tool.hatch.build.targets.sdist]
include = ["src/likesurgeon", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = [
  "live: requires a logged-in music.youtube.com session in a real browser; deselected by default. Run with `uv run pytest -m live`.",
]
